name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-lint:
    name: Compile & Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: |
          chmod +x ./gradlew
          ./gradlew compileAll

      - name: Static Analysis
        run: ./gradlew lint

      - name: Upload Static Analysis Reports (On Failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-analysis-reports
          path: |
            **/build/reports/pmd
            **/build/reports/spotbugs
            **/build/reports/spotless
          if-no-files-found: ignore

  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-24.04
    needs: compile-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Tests, Coverage Report & Verify Thresholds
        run: ./gradlew test jacocoRootReport jacocoRootCoverageVerification

      - name: Generate Coverage Summary Report
        if: always()
        run: python3 scripts/parse-coverage.py

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test
            **/build/test-results/test
          if-no-files-found: ignore

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: "**/build/reports/jacoco"
          if-no-files-found: ignore

  review:
    name: Claude Code Review
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: github.event_name == 'pull_request' && success()
    # Reviewer-only permissions: read code, write comments. No `contents: write`.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # let Claude read this run's CI results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Focused reviewer #1 — Domain-Driven Design & module boundaries.
      - name: Claude Review — Domain & Boundaries
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # Skill invocation drives the review; the skill IS the checklist (we don't restate its rules).
          # Works because `actions/checkout` above makes `.claude/skills/` available to the action.
          prompt: |
            /insurance-module-boundaries Act as the domain & module-boundary reviewer for
            pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Also apply the /insurance-create-cross-module-reference skill wherever this PR adds
            a cross-module reference. Use those skills' rules (their workflow and "Forbidden"
            constraints) as your review checklist — do not modify any code.

            Get the diff with `gh pr diff` / `gh pr view` and review ONLY changes this PR introduces.
            Do NOT report anything the ArchUnit ArchitectureTest, PMD, SpotBugs, or Spotless already
            fail the build on, nor pre-existing issues or pedantic nitpicks.

            Report specific line issues with `mcp__github_inline_comment__create_inline_comment`
            (do NOT pass `confirmed: true`). Post ONE summary via `gh pr comment` headed
            `### Domain & Boundaries review`. Post only to GitHub, never as a chat reply; if nothing
            is noteworthy in this focus, post a one-line summary saying so.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,LS"

      # Focused reviewer #2 — semantic correctness, transactions & test quality.
      - name: Claude Review — Correctness & Tests
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            /insurance-testing Act as the correctness & testing reviewer for pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}. Use this skill's
            rules as your checklist for test quality, and also apply the /insurance-observability
            skill for business-flow logging. Do not modify any code.

            Beyond the skills, judge semantic/business-logic correctness, transaction boundaries,
            exception handling and edge cases — especially the Quote -> Policy -> Account
            event-driven flow (no skill covers this; use engineering judgment).

            Get the diff with `gh pr diff` / `gh pr view` and review ONLY changes this PR introduces.
            Do NOT report anything the ArchUnit ArchitectureTest, PMD, SpotBugs, or Spotless already
            fail the build on, nor pre-existing issues or pedantic nitpicks.

            Report specific line issues with `mcp__github_inline_comment__create_inline_comment`
            (do NOT pass `confirmed: true`). Post ONE summary via `gh pr comment` headed
            `### Correctness & Tests review`. Post only to GitHub, never as a chat reply; if nothing
            is noteworthy in this focus, post a one-line summary saying so.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,LS"

      # Focused reviewer #3 — security roles, policies & i18n.
      - name: Claude Review — Security & Roles
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            /insurance-security-roles Act as the security & roles reviewer for pull request
            #${{ github.event.pull_request.number }} in ${{ github.repository }}. Use this skill's
            rules as your review checklist. Do not modify any code.

            Additionally verify all user-visible text uses `msg://` keys (flag hardcoded labels)
            and that any new role policy references view/menu IDs that actually exist in the changed code.

            Get the diff with `gh pr diff` / `gh pr view` and review ONLY changes this PR introduces.
            Do NOT report anything the ArchUnit ArchitectureTest, PMD, SpotBugs, or Spotless already
            fail the build on, nor pre-existing issues or pedantic nitpicks.

            Report specific line issues with `mcp__github_inline_comment__create_inline_comment`
            (do NOT pass `confirmed: true`). Post ONE summary via `gh pr comment` headed
            `### Security & Roles review`. Post only to GitHub, never as a chat reply; if nothing
            is noteworthy in this focus, post a one-line summary saying so.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob,LS"
